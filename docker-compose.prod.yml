version: "3.8"

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: goldguard-gateway
    restart: unless-stopped
    environment:
      - PORT=10100
      - OPENCODEX_API_AUTH_TOKEN=${OPENCODEX_API_AUTH_TOKEN}
      - OPENCODEX_ADMIN_AUTH_TOKEN=${OPENCODEX_ADMIN_AUTH_TOKEN}
    ports:
      - "10100:10100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10100/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: goldguard-backend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - GOLDGUARD_MODE=paper
      - GOLDGUARD_ENVIRONMENT=production
      - GOLDGUARD_DATA_DIR=/data
      - GOLDGUARD_SESSION_SECRET=${GOLDGUARD_SESSION_SECRET}
      - GOLDGUARD_LIVE_CAPABILITY_ENABLED=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODEX_BASE_URL=http://gateway:10100
      - OPENCODEX_API_AUTH_TOKEN=${OPENCODEX_API_AUTH_TOKEN}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - PORT=8000
    volumes:
      - goldguard_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  goldguard_data:
    driver: local
