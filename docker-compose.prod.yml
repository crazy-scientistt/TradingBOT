version: "3.8"

services:
  opencodex:
    image: python:3.11-slim
    container_name: goldguard-opencodex-gateway
    restart: unless-stopped
    command: python -m uvicorn gateway.app:app --host 0.0.0.0 --port 10100
    environment:
      - PORT=10100
      - OPENCODEX_PROVIDER=google-antigravity
      - GEMINI_MODEL=gemini-3.7-flash
    ports:
      - "10100:10100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10100/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: goldguard-backend
    restart: unless-stopped
    depends_on:
      opencodex:
        condition: service_started
    environment:
      - GOLDGUARD_MODE=paper
      - GOLDGUARD_DB_PATH=/app/data/goldguard.db
      - GOLDGUARD_GATEWAY_URL=http://opencodex:10100
      - GOLDGUARD_DEFAULT_MODEL=google-antigravity/gemini-3.7-flash
      - GOLDGUARD_AUTONOMY_ENABLED=true
    volumes:
      - goldguard_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py", "--db", "/app/data/goldguard.db", "--gateway-url", "http://opencodex:10100"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  goldguard_data:
    driver: local
