services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: goldguard-gateway
    restart: unless-stopped
    ports:
      - "10100:10100"
    environment:
      - PORT=10100
      - OPENCODEX_API_AUTH_TOKEN=${OPENCODEX_API_AUTH_TOKEN:-dev-opencodex-token}
    volumes:
      - gateway-data:/app/.opencodex
    networks:
      - goldguard-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: goldguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENCODEX_BASE_URL=http://gateway:10100
      - OPENCODEX_API_AUTH_TOKEN=${OPENCODEX_API_AUTH_TOKEN:-dev-opencodex-token}
      - GOLDGUARD_ENVIRONMENT=development
      - GOLDGUARD_MODE=paper
    depends_on:
      - gateway
    volumes:
      - backend-data:/app/data
    networks:
      - goldguard-net

volumes:
  gateway-data:
  backend-data:

networks:
  goldguard-net:
    driver: bridge
